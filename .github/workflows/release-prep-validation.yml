name: Release-prep validation

on:
  push:
    branches:
      - opendm-release-prep
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-typecheck:
    name: Vitest + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-dummy-anon-key-000000000000000000000000
          SUPABASE_SERVICE_ROLE_KEY: ci-only-dummy-service-role-key-000000000000
          TOKEN_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CRON_SECRET: ci-only-cron-secret-not-for-deployment
          NEXT_PUBLIC_APP_URL: https://example.com
