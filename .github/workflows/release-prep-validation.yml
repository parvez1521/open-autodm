name: Release-prep validation

on:
  push:
    branches:
      - opendm-release-prep
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-typecheck:
    name: Vitest + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck
